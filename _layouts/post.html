<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">

    <style type="text/css">
      blockquote.note {
        border-left: 4px solid #3182ce;
        background: #ebf8ff;
        color: #2c5282;
        padding: 1em 1em 0.5em 2.1em; /* Add left padding for icon/label */
        margin:0.5em 0;
        font-style: normal;
        position: relative;

        border-radius: 0.5em;         /* Rounded corners */
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); /* Subtle shadow */
      }

      blockquote.note::before {
        content: '✦ Note:';
        position: absolute;
        top: 0.8em;
        left: 1em;
        font-weight: bold;
      }

       blockquote.warning {
        border-left: 4px solid #f6ad55;
        background: #fffaf0;
        color: #7b341e;
        padding: 1em 1em 0.5em 2.1em; /* Add left padding for icon/label */
        margin:0.5em 0;
        font-style: normal;
        position: relative;

        border-radius: 0.5em;         /* Rounded corners */
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); /* Subtle shadow */
      }

      blockquote.warning::before {
        content: '⚠︎ Warning:';
        position: absolute;
        top: 0.8em;
        left: 0.8em;
        font-weight: bold;
      }

    </style>
  </head>

  <body>
    {% include header.html %}
    <main id="content">
      <section class="post">
        {% if page.title %}
          <h1 class="post-title">{{ page.title }}</h1>
        {% endif %}
        {{ content }}
      </section>
    </main>
    {% include footer.html %}
    <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
  </body>
</html>
